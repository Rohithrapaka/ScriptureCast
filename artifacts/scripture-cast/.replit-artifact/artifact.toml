kind = "web"
previewPath = "/"
title = "ScriptureCast"
version = "1.0.0"
id = "artifacts/scripture-cast"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23946

[services.development]
run = "pnpm --filter @workspace/scripture-cast run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scripture-cast", "run", "build" ]
publicDir = "artifacts/scripture-cast/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23946"
BASE_PATH = "/"
