openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ScriptureCast API — Bilingual Telugu/English Bible presentation platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bible
    description: Bible navigation and lookup
  - name: presentation
    description: Presentation state management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /bible/books:
    get:
      operationId: listBooks
      tags: [bible]
      summary: List all Bible books
      responses:
        "200":
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Book"

  /bible/books/{bookId}/chapters:
    get:
      operationId: listChapters
      tags: [bible]
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of chapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chapter"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bible/books/{bookId}/chapters/{chapterNum}/verses:
    get:
      operationId: listVerses
      tags: [bible]
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: chapterNum
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of verses (both Telugu and English when available)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Verse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bible/books/{bookId}/chapters/{chapterNum}/verses/{verseNum}:
    get:
      operationId: getVerse
      tags: [bible]
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
        - name: chapterNum
          in: path
          required: true
          schema:
            type: integer
        - name: verseNum
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The verse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerseDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bible/search:
    get:
      operationId: searchBible
      tags: [bible]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"

  /presentation/state:
    get:
      operationId: getPresentationState
      tags: [presentation]
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationState"

    post:
      operationId: updatePresentationState
      tags: [presentation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresentationStateInput"
      responses:
        "200":
          description: Updated state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresentationState"

  /presentation/clear:
    post:
      operationId: clearPresentation
      tags: [presentation]
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Book:
      type: object
      required: [id, name, englishName, chapters]
      properties:
        id:
          type: string
          description: Telugu book name used as the unique identifier
        name:
          type: string
          description: Telugu book name (display)
        englishName:
          type: string
          description: English book name (display)
        chapters:
          type: integer

    Chapter:
      type: object
      required: [number, verses]
      properties:
        number:
          type: integer
        verses:
          type: integer

    Verse:
      type: object
      required: [number, text]
      properties:
        number:
          type: integer
        text:
          type: string
          description: Telugu verse text
        textEnglish:
          type: ["string", "null"]
          description: KJV English verse text (null when unavailable)

    VerseDetail:
      type: object
      required: [bookId, bookName, englishName, chapter, verse, text, reference, referenceEnglish]
      properties:
        bookId:
          type: string
        bookName:
          type: string
          description: Telugu book name
        englishName:
          type: string
          description: English book name
        chapter:
          type: integer
        verse:
          type: integer
        text:
          type: string
          description: Telugu verse text
        textEnglish:
          type: ["string", "null"]
          description: KJV English verse text
        reference:
          type: string
          description: Telugu reference e.g. "యోహాను 3:16"
        referenceEnglish:
          type: string
          description: English reference e.g. "John 3:16"

    SearchResult:
      type: object
      required: [query, result]
      properties:
        query:
          type: string
        result:
          type: ["object", "null"]
          properties:
            bookId:
              type: string
            bookName:
              type: string
            englishName:
              type: string
            chapter:
              type: integer
            verse:
              type: integer
            text:
              type: string
            textEnglish:
              type: ["string", "null"]
            reference:
              type: string
            referenceEnglish:
              type: string

    # Inline verse shape used inside PresentationState
    PresentationVerse:
      type: object
      required: [bookId, bookName, englishName, chapter, verse, text, reference, referenceEnglish]
      properties:
        bookId:
          type: string
        bookName:
          type: string
        englishName:
          type: string
        chapter:
          type: integer
        verse:
          type: integer
        text:
          type: string
        textEnglish:
          type: ["string", "null"]
        reference:
          type: string
        referenceEnglish:
          type: string

    PresentationState:
      type: object
      required: [active, cleared]
      properties:
        active:
          type: boolean
        cleared:
          type: boolean
        verse:
          oneOf:
            - $ref: "#/components/schemas/PresentationVerse"
            - type: "null"
        language:
          type: string
          enum: [telugu, english, both]
          description: Which translation(s) to display
        layout:
          type: string
          enum: [stack, side-by-side]
          description: Layout for bilingual mode
        typography:
          $ref: "#/components/schemas/Typography"
        background:
          $ref: "#/components/schemas/Background"
        transition:
          $ref: "#/components/schemas/Transition"

    PresentationStateInput:
      type: object
      properties:
        active:
          type: boolean
        cleared:
          type: boolean
        verse:
          oneOf:
            - $ref: "#/components/schemas/PresentationVerse"
            - type: "null"
        language:
          type: string
          enum: [telugu, english, both]
        layout:
          type: string
          enum: [stack, side-by-side]
        typography:
          $ref: "#/components/schemas/Typography"
        background:
          $ref: "#/components/schemas/Background"
        transition:
          $ref: "#/components/schemas/Transition"

    Typography:
      type: object
      properties:
        fontFamily:
          type: string
        fontSize:
          type: integer
        fontWeight:
          type: string
          enum: [light, regular, medium, bold]
        textAlign:
          type: string
          enum: [left, center, right]
        textColor:
          type: string
        lineHeight:
          type: number
        shadow:
          type: boolean
        outline:
          type: boolean
        outlineWidth:
          type: integer
        showReference:
          type: boolean
        autoScale:
          type: boolean
          description: Automatically scale font size based on verse length
        refFontSize:
          type: integer
          description: Reference text font size in px (0 = auto, defaults to ~52% of main)
        refFontWeight:
          type: string
          enum: [light, regular, medium, bold]
          description: Reference text font weight (defaults to same as main)

    Background:
      type: object
      properties:
        type:
          type: string
          enum: [solid, gradient, image]
        color:
          type: string
        gradientStart:
          type: string
        gradientEnd:
          type: string
        gradientDirection:
          type: string
        imageUrl:
          type: ["string", "null"]

    Transition:
      type: object
      properties:
        type:
          type: string
          enum: [fade, slide, crossfade]
        duration:
          type: integer

    ClearResult:
      type: object
      required: [cleared]
      properties:
        cleared:
          type: boolean

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
