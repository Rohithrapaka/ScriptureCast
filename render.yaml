services:
  - type: web
    name: scripture-cast
    runtime: node
    # Install pnpm (pnpm is required; the project uses pnpm workspaces)
    buildCommand: >-
      npm install -g pnpm@10 &&
      pnpm install --frozen-lockfile &&
      NODE_ENV=production pnpm --filter @workspace/scripture-cast run build &&
      pnpm --filter @workspace/api-server run build
    # Start from the repo root so process.cwd() resolves Bible data paths
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
    # Render free tier: services spin down after 15 min of inactivity.
    # For active church services the instance stays warm the whole time.
    # Upgrade to a paid plan for always-on hosting.
    healthCheckPath: /api/healthz
